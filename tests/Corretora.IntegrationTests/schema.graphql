schema {
  query: Query
}

type Query {
  usuario(id: Int!): Usuario @cost(weight: "10")
  usuarios: [Usuario!]! @cost(weight: "10")
}

type Endereco {
  rua: String!
  numero: Int!
  cidade: String!
}

type PosicaoNaCarteira {
  ativo: String!
  quantidade: Decimal!
  saldo: Decimal!
  participacao: Decimal!
}

type PosicaoRentabilidade {
  ativo: String!
  percentualMes: Decimal!
}

type Transacao {
  id: Int!
  ativo: String!
  tipo: TipoTransacao!
  valor: Decimal!
  data: LocalDate!
}

type Usuario {
  carteira: [PosicaoNaCarteira!]! @cost(weight: "10")
  rentabilidade: [PosicaoRentabilidade!]! @cost(weight: "10")
  transacoes: [Transacao!]! @cost(weight: "10")
  id: Int!
  nome: String!
  email: String!
  telefone: String!
  endereco: Endereco!
}

enum TipoTransacao {
  COMPRA
  VENDA
}

"The `Decimal` scalar type represents a decimal floating-point number with high precision."
scalar Decimal
  @specifiedBy(url: "https://scalars.graphql.org/chillicream/decimal.html")

"The `LocalDate` scalar type represents a date without time or time zone information."
scalar LocalDate
  @specifiedBy(url: "https://scalars.graphql.org/chillicream/local-date.html")

"The purpose of the `cost` directive is to define a `weight` for GraphQL types, fields, and arguments. Static analysis can use these weights when calculating the overall cost of a query or response."
directive @cost(
  "The `weight` argument defines what value to add to the overall cost for every appearance, or possible appearance, of a type, field, argument, etc."
  weight: String!
) on
  | SCALAR
  | OBJECT
  | FIELD_DEFINITION
  | ARGUMENT_DEFINITION
  | ENUM
  | INPUT_FIELD_DEFINITION